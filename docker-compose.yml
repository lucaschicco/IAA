# Levanta la base Postgres del sistema con: make db
# La primera vez crea las tablas de usuarios y roles automáticamente.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: consorcio
    ports:
      - "5432:5432"
    volumes:
      - datos_postgres:/var/lib/postgresql/data
      - ./src/auth/01_tablas.sql:/docker-entrypoint-initdb.d/01_tablas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 15

volumes:
  datos_postgres:
