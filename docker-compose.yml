# Levanta la base Postgres y el bucket de PDF con: make db
# La primera vez crea las tablas automáticamente.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: consorcio
    ports:
      - "5432:5432"
    volumes:
      - datos_postgres:/var/lib/postgresql/data
      - ./src/auth/01_tablas.sql:/docker-entrypoint-initdb.d/01_tablas.sql:ro
      - ./src/almacen/01_archivos.sql:/docker-entrypoint-initdb.d/02_archivos.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 15

  # Bucket de PDF, compatible con S3. Consola web en http://localhost:9001
  bucket:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio-clave-local
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - datos_bucket:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      retries: 15

volumes:
  datos_postgres:
  datos_bucket:
