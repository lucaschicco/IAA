# Nombre fijo: los volúmenes (iaa_pgdata, iaa_seaweeddata) no dependen de cómo se llame la carpeta del repo.
name: iaa

services:
  app:
    build: .
    container_name: consorcio-app
    env_file: .env
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      seaweedfs:
        condition: service_healthy
      postgres:
        condition: service_healthy
    # Solo en la máquina local. 8001: la web demo que se levanta a mano dentro de `app`.
    # 8002: la API JSON del login (`make api`); antes compartía el 8001 y chocaba con la demo.
    # El puerto nuevo se publica al recrear el contenedor (`docker compose up -d app`).
    ports:
      - "127.0.0.1:8001:8001"
      - "127.0.0.1:8002:8002"
    command: sleep infinity

  # Bot de Telegram. Tiene perfil para que `docker compose up -d` no lo levante sin token:
  # `make bot` (= docker compose --profile bot up -d bot), `make bot-logs`, `make bot-down`.
  bot:
    build: .
    container_name: consorcio-bot
    profiles: ["bot"]
    env_file: .env
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      seaweedfs:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    command: consorcio bot

  # Web de pruebas. Con perfil, como el bot: `docker compose up -d` no la levanta.
  # `make web`, `make web-logs`, `make web-down`. Solo se publica en la máquina local.
  web:
    build: .
    container_name: consorcio-web
    profiles: ["web"]
    env_file: .env
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      seaweedfs:
        condition: service_healthy
      postgres:
        condition: service_healthy
      # Opcional: la web anda sin MLflow, pero así Compose lo levanta junto con ella
      mlflow:
        condition: service_started
        required: false
    ports:
      - "127.0.0.1:8000:8000"
    command: uvicorn --factory consorcio.web.app:crear_app --host 0.0.0.0 --port 8000

  postgres:
    image: postgres:16
    container_name: consorcio-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-consorcio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-consorcio}
      POSTGRES_DB: ${POSTGRES_DB:-consorcio}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-consorcio} -d ${POSTGRES_DB:-consorcio}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: consorcio-mlflow
    environment:
      # Sin esto MLflow rechaza el Host "mlflow:5000" con el que lo llama la app (403, "DNS rebinding")
      MLFLOW_SERVER_ALLOWED_HOSTS: "mlflow,mlflow:5000,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000"
      MLFLOW_SERVER_CORS_ALLOWED_ORIGINS: "http://localhost:5000,http://127.0.0.1:5000"
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/mlartifacts
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow:/mlflow

  # PDF originales (API S3). Sin autenticación: el puerto se publica solo en la máquina local.
  seaweedfs:
    image: chrislusf/seaweedfs:4.50
    container_name: consorcio-seaweedfs
    command: server -dir=/data -s3
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweeddata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  seaweeddata:
  pgdata:
