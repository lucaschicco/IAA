services:
  app:
    build: .
    container_name: consorcio-app
    env_file: .env
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    command: sleep infinity

  # Bot de Telegram. Tiene perfil para que `docker compose up -d` no lo levante sin token:
  # `make bot` (= docker compose --profile bot up -d bot), `make bot-logs`, `make bot-down`.
  bot:
    build: .
    container_name: consorcio-bot
    profiles: ["bot"]
    env_file: .env
    volumes:
      - .:/app
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped
    command: consorcio bot

  postgres:
    image: postgres:16
    container_name: consorcio-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-consorcio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-consorcio}
      POSTGRES_DB: ${POSTGRES_DB:-consorcio}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-consorcio} -d ${POSTGRES_DB:-consorcio}"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5
    container_name: consorcio-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-consorcio123}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"   # navegador web
      - "7687:7687"   # bolt
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: consorcio-mlflow
    environment:
      # Sin esto MLflow rechaza el Host "mlflow:5000" con el que lo llama la app (403, "DNS rebinding")
      MLFLOW_SERVER_ALLOWED_HOSTS: "mlflow,mlflow:5000,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000"
      MLFLOW_SERVER_CORS_ALLOWED_ORIGINS: "http://localhost:5000,http://127.0.0.1:5000"
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/mlartifacts
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow:/mlflow

volumes:
  pgdata:
  neo4jdata:
