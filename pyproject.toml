[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "consorcio"
version = "0.1.0"
description = "Agente para la administración de consorcios (TP IAA, UBA, Grupo 6)"
requires-python = ">=3.11"
dependencies = [
    # Orquestación y modelos
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langgraph>=1.0",
    "langchain-google-genai>=2.1",
    "langchain-anthropic>=1.0",
    "langchain-openai>=1.0",
    # Configuración y esquemas
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # PDF, imágenes y OCR
    "pdfplumber>=0.11",
    "pypdfium2>=4.30",
    "pytesseract>=0.3.13",
    "pillow>=10.3",
    # Almacenamiento
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "neo4j>=5.20",
    # Trazabilidad
    "mlflow-skinny>=3.0",
    "pandas>=2.0",  # lo importa mlflow.langchain (autolog de trazas GenAI); skinny no lo trae
    "python-dotenv>=1.0",
    # Canales
    "python-telegram-bot>=22.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
consorcio = "consorcio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Reglas explícitas para que el lint sea igual en todas las máquinas
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # el largo de línea lo maneja el formateador

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
